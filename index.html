<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mappa Istituto Einstein</title>

    <!-- Tom-Select CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.bootstrap5.min.css"
      rel="stylesheet"
    />
    <!-- Collegamento CSS Principale -->
    <link rel="stylesheet" href="css/style.css" />

    <!-- Favicon / Icone PWA per Tab e iOS -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/icons/icon-school-day-192.png"
    />
    <link
      rel="apple-touch-icon"
      href="./assets/icons/icon-school-day-192.png"
    />

    <!-- Iniezione Dinamica del Manifest PWA -->
    <script>
      (function () {
        const urlParams = new URLSearchParams(window.location.search);
        const configFile = urlParams.get("config") || "school-day";

        const link = document.createElement("link");
        link.rel = "manifest";

        if (configFile === "open-school") {
          link.href = "manifest-open-school.json";
        } else {
          link.href = "manifest-school-day.json";
        }

        document.head.appendChild(link);
      })();
    </script>

    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Mappa Istituto" />
  </head>
  <body>
    <div class="app-container">
      <aside class="top-control-bar">
        <header class="app-header">
          <h1>Mappa Istituto</h1>
        </header>

        <div id="route-info" class="route-banner">
          <!-- Selettore Partenza -->
          <div class="route-selector">
            <label for="select-from" class="label-from">DA:</label>
            <select
              id="select-from"
              class="route-dropdown dropdown-from"
            ></select>
          </div>

          <!-- Barra Pulsanti d'Azione Compatta (Swap + Share) -->
          <div class="actions-row">
            <button
              id="btn-swap"
              class="btn-swap"
              title="Inverti Origine e Destinazione"
              aria-label="Inverti Origine e Destinazione"
            >
              <svg
                class="swap-icon"
                viewBox="0 0 24 24"
                width="18"
                height="18"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M4 8h16M16 4l4 4-4 4"></path>
                <path d="M20 16H4M8 12l-4 4 4 4"></path>
              </svg>
            </button>

            <button
              id="btn-share"
              class="btn-share"
              title="Condividi percorso"
              aria-label="Condividi percorso"
            >
              <svg
                class="share-icon"
                viewBox="0 0 24 24"
                width="18"
                height="18"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="18" cy="5" r="3"></circle>
                <circle cx="6" cy="12" r="3"></circle>
                <circle cx="18" cy="19" r="3"></circle>
                <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
              </svg>
            </button>
          </div>

          <!-- Selettore Arrivo -->
          <div class="route-selector">
            <label for="select-to" class="label-to">A:</label>
            <select id="select-to" class="route-dropdown dropdown-to"></select>
          </div>
        </div>
      </aside>

      <main class="map-wrapper">
        <div id="map-container"></div>
      </main>
    </div>

    <!-- Pop-up Dettagli Stanza / Stand -->
    <div id="room-modal" class="modal-overlay hidden">
      <div class="modal-content">
        <button id="modal-close" class="modal-close-btn">&times;</button>
        <span id="modal-category" class="modal-badge"></span>
        <h2 id="modal-title"></h2>
        <p id="modal-description"></p>
        <div class="modal-actions">
          <button id="btn-set-destination" class="btn-primary">
            Imposta come Destinazione
          </button>
        </div>
      </div>
    </div>

    <!-- Collegamenti JS -->
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>
    <script type="module" src="js/script.js"></script>
  </body>
</html>
