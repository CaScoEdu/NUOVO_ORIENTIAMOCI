<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mappa Istituto — Open Day</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Collegamento al Manifest della PWA -->
    <link rel="manifest" href="manifest.json" />

    <!-- Colore della barra di stato del telefono -->
    <meta name="theme-color" content="#0f172a" />

    <!-- Configurazione specifica per iOS / Safari -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Open School" />
    <link rel="apple-touch-icon" href="icon-192.png" />
  </head>
  <body>
    <div class="app-container">
      <aside class="top-control-bar">
        <header class="app-header">
          <h1>Mappa Istituto</h1>
        </header>

        <div id="route-info" class="route-banner">
          <div class="route-selector">
            <label for="select-from" class="label-from">DA:</label>
            <select
              id="select-from"
              class="route-dropdown dropdown-from"
            ></select>
          </div>

          <!-- Pulsante Swap Interattivo con Icona SVG Orizzontale -->
          <button
            id="btn-swap"
            class="btn-swap"
            title="Inverti Origine e Destinazione"
            aria-label="Inverti Origine e Destinazione"
          >
            <svg
              class="swap-icon"
              viewBox="0 0 24 24"
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M4 8h16M16 4l4 4-4 4"></path>
              <path d="M20 16H4M8 12l-4 4 4 4"></path>
            </svg>
          </button>

          <div class="route-selector">
            <label for="select-to" class="label-to">A:</label>
            <select id="select-to" class="route-dropdown dropdown-to"></select>
          </div>
        </div>
      </aside>

      <main class="map-wrapper">
        <!-- Contenitore in cui verrà caricato dinamicamente l'SVG esterno -->
        <div id="map-container"></div>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
